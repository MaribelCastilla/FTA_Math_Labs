              {currentTab === 'triangles' && (
                <>
                  <div className="card">
                    <div className="card-title">{txt.triVertices}</div>
                    <p className="instruction" dangerouslySetInnerHTML={{ __html: txt.triDragInstr }}></p>
                    <div className="control-header"><span>{txt.lblVertexA}</span></div>
                    {renderSlider('Ax', -8, 8, triangleParams.A.x, 0.5, (v) => setTriangleParams(prev => ({ ...prev, A: { ...prev.A, x: v } })))}
                    {renderSlider('Ay', -8, 8, triangleParams.A.y, 0.5, (v) => setTriangleParams(prev => ({ ...prev, A: { ...prev.A, y: v } })))}
                    <div className="control-header" style={{ marginTop: '5px' }}><span>{txt.lblVertexB}</span></div>
                    {renderSlider('Bx', -8, 8, triangleParams.B.x, 0.5, (v) => setTriangleParams(prev => ({ ...prev, B: { ...prev.B, x: v } })))}
                    {renderSlider('By', -8, 8, triangleParams.B.y, 0.5, (v) => setTriangleParams(prev => ({ ...prev, B: { ...prev.B, y: v } })))}
                    <div className="control-header" style={{ marginTop: '5px' }}><span>{txt.lblVertexC}</span></div>
                    {renderSlider('Cx', -8, 8, triangleParams.C.x, 0.5, (v) => setTriangleParams(prev => ({ ...prev, C: { ...prev.C, x: v } })))}
                    {renderSlider('Cy', -8, 8, triangleParams.C.y, 0.5, (v) => setTriangleParams(prev => ({ ...prev, C: { ...prev.C, y: v } })))}
                  </div>

                  <div className="card">
                    <div className="card-title">{txt.triCenters}</div>
                    <label style={{ fontSize: '0.85rem', display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                      <input 
                        type="checkbox" 
                        checked={triangleParams.showCircumcenter} 
                        onChange={(e) => setTriangleParams(prev => ({ ...prev, showCircumcenter: e.target.checked }))} 
                      />
                      <span className="badge badge-accent">{txt.triCircumcenter}</span> {txt.triCircumDesc}
                    </label>
                    <label style={{ fontSize: '0.85rem', display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                      <input 
                        type="checkbox" 
                        checked={triangleParams.showCentroid} 
                        onChange={(e) => setTriangleParams(prev => ({ ...prev, showCentroid: e.target.checked }))} 
                      />
                      <span className="badge badge-danger">{txt.triCentroid}</span> {txt.triCentroidDesc}
                    </label>
                    <label style={{ fontSize: '0.85rem', display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                      <input 
                        type="checkbox" 
                        checked={triangleParams.showOrthocenter} 
                        onChange={(e) => setTriangleParams(prev => ({ ...prev, showOrthocenter: e.target.checked }))} 
                      />
                      <span className="badge badge-warning">{txt.triOrthocenter}</span> {txt.triOrthocenterDesc}
                    </label>
                    <label style={{ fontSize: '0.85rem', display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                      <input 
                        type="checkbox" 
                        checked={triangleParams.showIncenter} 
                        onChange={(e) => setTriangleParams(prev => ({ ...prev, showIncenter: e.target.checked }))} 
                      />
                      <span className="badge badge-primary">{txt.triIncenter}</span> {txt.triIncenterDesc}
                    </label>
                  </div>

                  <div className="card">
                    <div className="card-title">{txt.triProperties}</div>
                    <table className="results-table">
                      <tbody>
                        <tr><td>{txt.triAreaDet}</td><td><b>{r(triPropData.area)} u²</b></td></tr>
                        <tr><td>{txt.triPerimeter}</td><td>{r(triPropData.perim)} u</td></tr>
                        {triangleParams.showCentroid && (
                          <tr><td>{txt.triCentroid} (G):</td><td><b>({r(triPropData.G.x)}, {r(triPropData.G.y)})</b></td></tr>
                        )}
                        {triangleParams.showIncenter && (
                          <tr><td>{txt.triIncenter} (I):</td><td><b>({r(triPropData.In.x)}, {r(triPropData.In.y)})</b></td></tr>
                        )}
                        {triangleParams.showCircumcenter && triPropData.O && (
                          <tr><td>{txt.triCircumcenter} (O):</td><td><b>({r(triPropData.O.x)}, {r(triPropData.O.y)})</b></td></tr>
                        )}
                        {triangleParams.showOrthocenter && triPropData.H && (
                          <tr><td>{txt.triOrthocenter} (H):</td><td><b>({r(triPropData.H.x)}, {r(triPropData.H.y)})</b></td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>

            {/* Canvas y Desarrollo inferior */}
            <div className="flex-1 flex flex-col min-w-0 bg-slate-50 relative">
              <div className="flex-1 relative bg-white overflow-hidden">
                <canvas
                  ref={canvasRef}
                  onMouseDown={handleMouseDown}
                  onMouseMove={handleMouseMove}
                  onMouseUp={handleMouseUp}
                  onWheel={handleWheel}
                  style={{ width: '100%', height: '100%', display: 'block', cursor: 'crosshair' }}
                />
                
                {/* Botones de zoom / reset flotantes */}
                <div className="absolute top-4 right-4 bg-white/90 backdrop-blur-sm p-1.5 rounded-lg border border-slate-200 flex gap-1.5 shadow-md z-10">
                  <button title="Zoom In" onClick={() => zoom(1.2)} className="w-8 h-8 flex items-center justify-center font-bold border border-slate-200 bg-white rounded hover:bg-slate-100">+</button>
                  <button title="Zoom Out" onClick={() => zoom(0.8)} className="w-8 h-8 flex items-center justify-center font-bold border border-slate-200 bg-white rounded hover:bg-slate-100">−</button>
                  <button title="Centrar / Reset View" onClick={resetView} className="w-8 h-8 flex items-center justify-center font-bold border border-slate-200 bg-white rounded hover:bg-slate-100">⌖</button>
                </div>

                {/* Pie de página institucional fijado en el canvas */}
                <div className="absolute bottom-1 right-2 text-[9px] text-gray-400 font-mono select-none pointer-events-none z-10">
                  {txt.footer}
                </div>
              </div>

              {/* Panel inferior para el desarrollo de triángulos o relaciones */}
              {(currentTab === 'triangles' || currentTab === 'relations') && (
                <div className="h-64 bg-slate-50 border-t border-slate-200 p-4 overflow-y-auto shrink-0 shadow-inner">
                  {currentTab === 'relations' && (
                    <>
                      <h3 style={{ color: 'var(--primary)', marginBottom: '0.8rem', fontWeight: 700 }}>Desarrollo Completo del Cálculo</h3>
                      <div className="math-step">
                        {metricParams.mode === '9' && (
                          Math.abs(metricParams.mr - metricParams.ms) > 1e-6 ? (
                            <>
                              <p><b>Fórmula Teórica:</b> <code>I = ((ns - nr)/(mr - ms), (mr·ns - ms·nr)/(mr - ms))</code></p>
                              <p>1. Sistema: <code>r: y = {metricParams.mr}x + ({metricParams.nr})</code> &nbsp;|&nbsp; <code>s: y = {metricParams.ms}x + ({metricParams.ns})</code></p>
                              <p>2. Igualación: <code>{metricParams.mr}x + ({metricParams.nr}) = {metricParams.ms}x + ({metricParams.ns})</code> &rarr; <code>({metricParams.mr} &minus; ({metricParams.ms}))x = {metricParams.ns} &minus; ({metricParams.nr})</code></p>
                              <p>3. Despeje de X: <code>x = ({metricParams.ns} &minus; ({metricParams.nr})) / ({metricParams.mr} &minus; ({metricParams.ms})) = {r((metricParams.ns - metricParams.nr) / (metricParams.mr - metricParams.ms))}</code></p>
                              <p>4. Sustitución de Y: <code>y = {metricParams.mr}({r((metricParams.ns - metricParams.nr) / (metricParams.mr - metricParams.ms))}) + ({metricParams.nr}) = {r(metricParams.mr * ((metricParams.ns - metricParams.nr) / (metricParams.mr - metricParams.ms)) + metricParams.nr)}</code></p>
                              <p><b>Punto de Intersección: I({r((metricParams.ns - metricParams.nr) / (metricParams.mr - metricParams.ms))}, {r(metricParams.mr * ((metricParams.ns - metricParams.nr) / (metricParams.mr - metricParams.ms)) + metricParams.nr)})</b></p>
                            </>
                          ) : (
                            <p>Las pendientes son idénticas (<code>m_r = m_s = {metricParams.mr}</code>). Rectas paralelas o coincidentes.</p>
                          )
                        )}
                        {metricParams.mode === '10' && (() => {
                          const m_perp = -1 / metricParams.m;
                          const n_perp = metricParams.P.y - m_perp * metricParams.P.x;
                          const den = metricParams.m + (1 / metricParams.m);
                          const Xi = (metricParams.P.x / metricParams.m + metricParams.P.y - metricParams.n) / den;
                          const Yi = (metricParams.P.x + metricParams.m * metricParams.P.y + metricParams.n / metricParams.m) / den;
                          return (
                            <>
                              <p><b>Fórmula Teórica:</b> <code>Xi = (Xp/m + Yp - n) / (m + 1/m)</code> &nbsp;|&nbsp; <code>Yi = (Xp + m·Yp + n/m) / (m + 1/m)</code></p>
                              <p>1. Recta base dada: <code>r: y = {metricParams.m}x + ({metricParams.n})</code></p>
                              <p>2. Pendiente perpendicular: <code>m' = -1/m = -1/{metricParams.m} = {r(m_perp)}</code></p>
                              <p>3. Recta ortogonal por P({metricParams.P.x}, {metricParams.P.y}): <code>y &minus; {metricParams.P.y} = {r(m_perp)}(x &minus; {metricParams.P.x}) &rarr; y = {r(m_perp)}x + ({r(n_perp)})</code></p>
                              <p>4. Evaluación con fórmula: <code>X_i = ({metricParams.P.x}/{metricParams.m} + {metricParams.P.y} &minus; ({metricParams.n})) / ({metricParams.m} + 1/{metricParams.m}) = {r(Xi)}</code></p>
                              <p><b>Pie de la perpendicular: I({r(Xi)}, {r(Yi)})</b></p>
                            </>
                          );
                        })()}
                        {metricParams.mode === '11' && (
                          <>
                            <p><b>Fórmula Teórica:</b> <code>M = ((Xp + Xq)/2, (Yp + Yq)/2)</code></p>
                            <p>Puntos: <code>P({metricParams.P.x}, {metricParams.P.y})</code> y <code>Q({metricParams.Q.x}, {metricParams.Q.y})</code></p>
                            <p>Abscisa M_x: <code>({metricParams.P.x} + {metricParams.Q.x}) / 2 = {r((metricParams.P.x + metricParams.Q.x) / 2)}</code></p>
                            <p>Ordenada M_y: <code>({metricParams.P.y} + {metricParams.Q.y}) / 2 = {r((metricParams.P.y + metricParams.Q.y) / 2)}</code></p>
                            <p><b>Punto Medio: M({r((metricParams.P.x + metricParams.Q.x) / 2)}, {r((metricParams.P.y + metricParams.Q.y) / 2)})</b></p>
                          </>
                        )}
                        {metricParams.mode === '12' && (() => {
                          const dx = metricParams.Q.x - metricParams.P.x;
                          const dy = metricParams.Q.y - metricParams.P.y;
                          return (
                            <>
                              <p><b>Fórmula Teórica:</b> <code>d = √((Xq - Xp)² + (Yq - Yp)²)</code></p>
                              <p>Incremento horizontal: <code>Δx = {metricParams.Q.x} &minus; ({metricParams.P.x}) = {r(dx)}</code> &rarr; <code>(Δx)² = {r(dx * dx)}</code></p>
                              <p>Incremento vertical: <code>Δy = {metricParams.Q.y} &minus; ({metricParams.P.y}) = {r(dy)}</code> &rarr; <code>(Δy)² = {r(dy * dy)}</code></p>
                              <p>Suma bajo el radical: <code>{r(dx * dx)} + {r(dy * dy)} = {r(dx * dx + dy * dy)}</code></p>
                              <p><b>Distancia euclídea: d = √({r(dx * dx + dy * dy)}) = {r(Math.hypot(dx, dy))}</b></p>
                            </>
                          );
                        })()}
                        {metricParams.mode === '13' && (() => {
                          const num = metricParams.A1 * metricParams.P.x + metricParams.B1 * metricParams.P.y + metricParams.C1;
                          const den = Math.hypot(metricParams.A1, metricParams.B1);
                          return (
                            <>
                              <p><b>Fórmula Teórica:</b> <code>d = |A·Xp + B·Yp + C| / √(A² + B²)</code></p>
                              <p>1. Recta: <code>{metricParams.A1}x + ({metricParams.B1})y + ({metricParams.C1}) = 0</code> &nbsp;|&nbsp; Punto: <code>P({metricParams.P.x}, {metricParams.P.y})</code></p>
                              <p>2. Valor del numerador: <code>|{metricParams.A1}({metricParams.P.x}) + ({metricParams.B1})({metricParams.P.y}) + ({metricParams.C1})| = |{r(num)}| = {r(Math.abs(num))}</code></p>
                              <p>3. Denominador (módulo normal): <code>√({metricParams.A1}² + ({metricParams.B1})²) = √({metricParams.A1*metricParams.A1 + metricParams.B1*metricParams.B1}) = {r(den)}</code></p>
                              <p><b>Distancia mínima: d = {r(Math.abs(num))} / {r(den)} = {r(Math.abs(num) / (den || 1))}</b></p>
                            </>
                          );
                        })()}
                        {metricParams.mode === '14' && (() => {
                          const num = Math.abs(metricParams.ms - metricParams.mr);
                          const den = 1 + metricParams.ms * metricParams.mr;
                          return (
                            <>
                              <p><b>Fórmula Teórica:</b> <code>tan α = |ms - mr| / |1 + ms·mr|</code></p>
                              <p>Numerador: <code>|{metricParams.ms} &minus; ({metricParams.mr})| = {r(num)}</code></p>
                              <p>Denominador: <code>|1 + ({metricParams.ms})({metricParams.mr})| = |{r(den)}| = {r(Math.abs(den))}</code></p>
                              <p>Cociente: <code>tan α = {r(num)} / {r(Math.abs(den))} = {Math.abs(den) > 1e-6 ? r(num / Math.abs(den)) : '∞'}</code></p>
                              <p><b>Ángulo agudo: α = {Math.abs(den) > 1e-6 ? r(Math.atan(num / Math.abs(den)) * 180 / Math.PI) : 90}°</b></p>
                            </>
                          );
                        })()}
                        {metricParams.mode === '16.1' && (
                          <>
                            <p><b>Fórmula Teórica:</b> <code>d = |C1 - C2| / √(A² + B²)</code></p>
                            <p>Rectas paralelas: <code>{metricParams.A}x + ({metricParams.B})y + ({metricParams.C1}) = 0</code> &nbsp;y&nbsp; <code>{metricParams.A}x + ({metricParams.B})y + ({metricParams.C2}) = 0</code></p>
                            <p>Diferencia de coeficientes: <code>|{metricParams.C1} &minus; ({metricParams.C2})| = {r(Math.abs(metricParams.C1 - metricParams.C2))}</code></p>
                            <p>Módulo vector normal común: <code>√({metricParams.A}² + ({metricParams.B})²) = {r(Math.hypot(metricParams.A, metricParams.B))}</code></p>
                            <p><b>Distancia constante: d = {r(Math.abs(metricParams.C1 - metricParams.C2))} / {r(Math.hypot(metricParams.A, metricParams.B))} = {r(Math.abs(metricParams.C1 - metricParams.C2) / (Math.hypot(metricParams.A, metricParams.B) || 1))}</b></p>
                          </>
                        )}
                        {metricParams.mode === '16.2' && (() => {
                          const n1 = Math.hypot(metricParams.A1, metricParams.B1);
                          const n2 = Math.hypot(metricParams.A2, metricParams.B2);
                          return (
                            <>
                              <p><b>Fórmula Teórica:</b> <code>(A1·x + B1·y + C1) / √(A1² + B1²) = ± (A2·x + B2·y + C2) / √(A2² + B2²)</code></p>
                              <p>Módulos de vectores normales: <code>|n₁| = {r(n1)}</code> &nbsp;|&nbsp; <code>|n₂| = {r(n2)}</code></p>
                              <p>Bisectriz 1 (+): <code>({metricParams.A1}x + ({metricParams.B1})y + ({metricParams.C1})) / {r(n1)} = ({metricParams.A2}x + ({metricParams.B2})y + ({metricParams.C2})) / {r(n2)}</code></p>
                              <p>Bisectriz 2 (&minus;): <code>({metricParams.A1}x + ({metricParams.B1})y + ({metricParams.C1})) / {r(n1)} = &minus;({metricParams.A2}x + ({metricParams.B2})y + ({metricParams.C2})) / {r(n2)}</code></p>
                            </>
                          );
                        })()}
                      </div>
                    </>
                  )}

                  {currentTab === 'triangles' && (() => {
                    const { A, B, C, showCircumcenter, showOrthocenter, showCentroid, showIncenter } = triangleParams;
                    const eqAB = formatLineEq(A.y - B.y, B.x - A.x, A.x * B.y - B.x * A.y);
                    const eqBC = formatLineEq(B.y - C.y, C.x - B.x, B.x * C.y - C.x * B.y);
                    const eqCA = formatLineEq(C.y - A.y, A.x - C.x, C.x * A.y - A.x * C.y);
                    const area = 0.5 * Math.abs(A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));

                    const Mab = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
                    const Mbc = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 };

                    return (
                      <>
                        <h3 style={{ color: 'var(--primary)', marginBottom: '0.8rem', fontWeight: 700 }}>{txt.mathPanelTitle}</h3>
                        <div className="columns-2">
                          <div className="math-step">
                            <h4><span>{txt.mathSideEqs}</span></h4>
                            <p>{txt.mathSideAB}: <code>{eqAB}</code></p>
                            <p>{txt.mathSideBC}: <code>{eqBC}</code></p>
                            <p>{txt.mathSideCA}: <code>{eqCA}</code></p>
                            <p style={{ marginTop: '0.4rem', borderTop: '1px dashed #e2e8f0', paddingTop: '0.3rem' }}>
                              <b>{txt.mathAreaFormula}:</b><br />
                              <span style={{ fontSize: '0.8rem', color: '#64748b' }}>Fórmula: <code>Área = ½·|XA(YB &minus; YC) + XB(YC &minus; YA) + XC(YA &minus; YB)|</code></span><br />
                              <code>Área = ½·|{A.x}({B.y}&minus;{C.y}) + {B.x}({C.y}&minus;{A.y}) + {C.x}({A.y}&minus;{B.y})| = <b>{r(area)} u²</b></code>
                            </p>
                          </div>

                          {showCircumcenter && triPropData.O && (
                            <div className="math-step" style={{ borderLeft: '3px solid #059669' }}>
                              <h4 style={{ color: '#059669' }}>{txt.mathCircum}</h4>
                              <p><b>Definición:</b> Intersección de las mediatrices (pasan por el punto medio y son perpendiculares al lado).</p>
                              <p>1. Mediatriz AB por Mab({r(Mab.x)}, {r(Mab.y)}): <code>{formatLineEq(B.x - A.x, B.y - A.y, -((B.x - A.x)*Mab.x + (B.y - A.y)*Mab.y))}</code></p>
                              <p>2. Mediatriz BC por Mbc({r(Mbc.x)}, {r(Mbc.y)}): <code>{formatLineEq(C.x - B.x, C.y - B.y, -((C.x - B.x)*Mbc.x + (C.y - B.y)*Mbc.y))}</code></p>
                              <p>3. Resolución del sistema 2x2 &rarr; <b>Circuncentro O({r(triPropData.O.x)}, {r(triPropData.O.y)})</b></p>
                            </div>
                          )}

                          {showOrthocenter && triPropData.H && (
                            <div className="math-step" style={{ borderLeft: '3px solid #d97706' }}>
                              <h4 style={{ color: '#d97706' }}>{txt.mathOrtho}</h4>
                              <p><b>Definición:</b> Intersección de las alturas (pasan por cada vértice y son perpendiculares al lado opuesto).</p>
                              <p>1. Altura A por A({A.x}, {A.y}) ⟂ a BC: <code>{formatLineEq(C.x - B.x, C.y - B.y, -((C.x - B.x)*A.x + (C.y - B.y)*A.y))}</code></p>
                              <p>2. Altura B por B({B.x}, {B.y}) ⟂ a CA: <code>{formatLineEq(A.x - C.x, A.y - C.y, -((A.x - C.x)*B.x + (A.y - C.y)*B.y))}</code></p>
                              <p>3. Resolución del sistema &rarr; <b>Ortocentro H({r(triPropData.H.x)}, {r(triPropData.H.y)})</b></p>
                            </div>
                          )}

                          {showCentroid && (
                            <div className="math-step" style={{ borderLeft: '3px solid #dc2626' }}>
                              <h4 style={{ color: '#dc2626' }}>{txt.mathCentroid}</h4>
                              <p><b>Definición y fórmula teórica:</b> Intersección de las tres medianas (centro de gravedad). Divide cada mediana en razón 2:1.</p>
                              <p><code>G = ((XA + XB + XC) / 3, (YA + YB + YC) / 3)</code></p>
                              <p>Sustitución: <code>(({A.x} + {B.x} + {C.x})/3, ({A.y} + {B.y} + {C.y})/3) = <b>({r(triPropData.G.x)}, {r(triPropData.G.y)})</b></code></p>
                            </div>
                          )}

                          {showIncenter && (
                            <div className="math-step" style={{ borderLeft: '3px solid #2563eb' }}>
                              <h4 style={{ color: '#2563eb' }}>{txt.mathIncenter}</h4>
                              <p><b>Fórmula Teórica:</b> <code>I = (a·A + b·B + c·C) / (a + b + c)</code> &nbsp;|&nbsp; <code>r = Área / Semiperímetro</code></p>
                              <p>Lados: <code>a = {r(triPropData.a)}</code>, <code>b = {r(triPropData.b)}</code>, <code>c = {r(triPropData.cLen)}</code> (Perímetro = {r(triPropData.perim)})</p>
                              <p><b>Incentro I({r(triPropData.In.x)}, {r(triPropData.In.y)})</b> con radio inscrito <code>r = {r(area / (triPropData.perim / 2))}</code></p>
                            </div>
                          )}
                        </div>
                      </>
                    );
                  })()}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
